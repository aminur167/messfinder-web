<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess details | Mess Finder</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="page">

        <!-- loading, "not found" and error messages -->
        <div id="state" class="space-y-4"></div>

        <!-- the page itself, filled by js/mess-details.js -->
        <div id="mess" class="hidden">
            <section id="header-card" class="rounded-xl border border-line bg-white p-5"></section>

            <!-- the section tabs stay at the top while the page scrolls -->
            <nav id="section-tabs" class="hide-scrollbar sticky top-14 z-30 mt-4 flex overflow-x-auto rounded-xl border border-line bg-white px-2" aria-label="Sections">
                <a href="#overview" data-tab="overview" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">Overview</a>
                <a href="#rooms" data-tab="rooms" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">Rooms and seats</a>
                <a href="#facilities" data-tab="facilities" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">Facilities</a>
                <a href="#pricing" data-tab="pricing" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">Pricing</a>
                <a href="#history" data-tab="history" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">History</a>
                <a href="#reviews" data-tab="reviews" class="shrink-0 border-b-2 px-3 py-3 text-sm font-medium">Reviews</a>
            </nav>

            <div class="mt-4 lg:grid lg:grid-cols-[1fr_20rem] lg:items-start lg:gap-6">
                <div class="min-w-0 space-y-4">
                    <section id="overview" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                    <section id="rooms" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                    <section id="facilities" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                    <section id="pricing" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                    <section id="history" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                    <section id="reviews" class="scroll-mt-32 rounded-xl border border-line bg-white p-5"></section>
                </div>

                <aside class="mt-4 lg:mt-0">
                    <div id="quick-info" class="rounded-xl border border-line bg-white p-5 lg:sticky lg:top-32"></div>
                </aside>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/mess-details.js"></script>
</body>
</html>
