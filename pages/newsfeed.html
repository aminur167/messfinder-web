<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsfeed | Mess Finder</title>

    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="../js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="page">
        <h1 class="sr-only">Newsfeed</h1>

        <!-- the feed in the middle; wide screens also get a left box (you) and a right box (messes) -->
        <div id="layout" class="mx-auto max-w-2xl lg:max-w-5xl lg:grid lg:grid-cols-[minmax(0,1fr)_16rem] lg:gap-3 xl:max-w-[88rem] xl:grid-cols-[15rem_minmax(0,1fr)_16rem]">
            <aside id="left" class="hidden xl:sticky xl:top-16 xl:block xl:self-start"></aside>

            <div id="center" class="min-w-0 space-y-2">

                <!-- "Post a seat wanted" for students, "Post a vacancy" for managers (filled by js/newsfeed.js) -->
                <section id="composer" class="rounded-xl border border-line bg-white p-4"></section>

                <!-- filters -->
                <section class="rounded-xl border border-line bg-white p-4">
                    <div id="type-chips" class="flex flex-wrap gap-5">
                        <button type="button" data-type="" class="h-9 border-b-2 px-0.5 text-sm font-medium">All</button>
                        <button type="button" data-type="vacancy" class="h-9 border-b-2 px-0.5 text-sm font-medium">Vacancy</button>
                        <button type="button" data-type="seat_wanted" class="h-9 border-b-2 px-0.5 text-sm font-medium">Seat wanted</button>
                    </div>
                    <div class="mt-3 flex flex-wrap items-center gap-2">
                        <label for="filter-area" class="sr-only">Area</label>
                        <select id="filter-area" class="h-10 min-w-0 flex-1 rounded-lg border border-line bg-white px-2 text-sm focus:border-ochre focus:outline-none focus:ring-2 focus:ring-ochre/40">
                            <option value="">Any area</option>
                        </select>
                        <label for="filter-mess-type" class="sr-only">Boys or girls</label>
                        <select id="filter-mess-type" class="h-10 min-w-0 flex-1 rounded-lg border border-line bg-white px-2 text-sm focus:border-ochre focus:outline-none focus:ring-2 focus:ring-ochre/40">
                            <option value="">Boys and girls</option>
                            <option value="boys">Boys</option>
                            <option value="girls">Girls</option>
                        </select>
                        <label class="flex h-10 w-full items-center gap-2 text-sm sm:w-auto"><input id="filter-open" type="checkbox" class="accent-espresso"> Hide expired</label>
                    </div>
                </section>

                <!-- the posts -->
                <div id="feed" class="space-y-2"></div>
                <div id="pagination" class="pt-2"></div>
            </div>

            <!-- the right box (filled by js/newsfeed.js; the first part is only for students) -->
            <aside id="side" class="hidden space-y-2 lg:sticky lg:top-16 lg:block lg:self-start">
                <section id="side-interested" class="rounded-xl border border-line bg-white p-4">
                    <h2 class="mb-3 text-sm font-semibold"><i class="fa-solid fa-heart mr-2 text-ochre"></i>My interested messes</h2>
                    <div id="side-list"></div>
                </section>
                <section class="rounded-xl border border-line bg-white p-4">
                    <h2 class="mb-3 text-sm font-semibold"><i class="fa-solid fa-star mr-2 text-ochre"></i>Top rated messes</h2>
                    <div id="top-list"></div>
                </section>
            </aside>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/newsfeed.js"></script>
</body>
</html>
